server:
  port: ${SERVER_PORT:8080}

json:
  log:
    path: ${JSON_LOG_PATH:}

spring:
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:writeinone}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
    pool:
      validation-query: SELECT 1
      max-idle-time: 10m

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:writeinone}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-this-in-production-min-32-chars}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 30

gonemail:
  base-url: ${GONEMAIL_URL:http://localhost:7777}
  app-name: ${GONEMAIL_APP:writeinone}
  verification-template: email-verification
  password-reset-template: password-reset

schedulers:
  enabled: ${SCHEDULERS_ENABLED:true}

token-scheduler:
  interval-min: 30
  limit-deleted: 100

email-token-scheduler:
  interval-min: 5
  limit-deleted: 100

post-scheduler:
  interval-ms: 60000

site-verificator:
  interval-sec: 120

subdomains:
  base-domain: ${BASE_DOMAIN:writeinone.com}
  min-length: 3
  max-length: 30
  reservation-days: 7
  purge-interval-min: 60
  reserved:
    - www
    - blog
    - mail
    - email
    - smtp
    - imap
    - verify
    - admin
    - api
    - app
    - auth
    - login
    - owner
    - dashboard
    - static
    - cdn
    - assets
    - img
    - css
    - js
    - docs
    - help
    - support
    - status
    - dev
    - staging
    - test
    - demo
    - ns1
    - ns2
    - ftp
    - root
    - billing
    - account

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http_request_duration_milliseconds: true