<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${lang}">
<head>
  <th:block th:replace="~{fragments/layout :: head(${translation.title + ' — ' + (langConfig?.title ?: site.name)})}"/>

  <!-- Canonical -->
  <link rel="canonical"
        th:href="'https://' + ${site.domain} + ${prefix} + '/' + ${lang} + '/articles/' + ${translation.slug}"/>

  <th:block th:replace="~{fragments/layout :: alternates(${langSlugs})}"/>
  <meta name="robots" content="index,follow,max-image-preview:large"/>

  <!-- Primary meta -->
  <meta th:if="${translation.excerpt != null}" name="description" th:content="${translation.excerpt}"/>

  <!-- Open Graph -->
  <meta property="og:type" content="article"/>
  <meta property="og:site_name" th:content="${site.name}"/>
  <meta property="og:title" th:content="${translation.title}"/>
  <meta property="og:description" th:if="${translation.excerpt != null}" th:content="${translation.excerpt}"/>
  <meta property="og:image" th:if="${post.coverUrl != null}" th:content="${post.coverUrl}"/>
  <meta property="og:url"
        th:content="'https://' + ${site.domain} + ${prefix} + '/' + ${lang} + '/articles/' + ${translation.slug}"/>
  <meta property="article:published_time" th:if="${post.publishedAt != null}" th:content="${post.publishedAt}"/>
  <meta property="article:modified_time" th:content="${translation.updatedAt}"/>
  <meta property="article:tag" th:each="t : ${tags}" th:content="${t.name}"/>

  <!-- Twitter / X -->
  <meta name="twitter:card" th:content="${post.coverUrl != null ? 'summary_large_image' : 'summary'}"/>
  <meta name="twitter:title" th:content="${translation.title}"/>
  <meta name="twitter:description" th:if="${translation.excerpt != null}" th:content="${translation.excerpt}"/>
  <meta name="twitter:image" th:if="${post.coverUrl != null}" th:content="${post.coverUrl}"/>

  <script type="application/ld+json" th:utext="${jsonLd}"></script>

  <!-- href is updated by theme.js on DOMContentLoaded to match the active theme -->
  <link id="hljs-theme" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"/>
</head>
<body>
<th:block th:replace="~{fragments/layout :: bodyStart}"/>
<th:block th:replace="~{fragments/layout :: nav}"/>

<main class="container">
  <article>
    <header class="post-header">
      <a class="post-header__back" th:href="${prefix} + '/' + ${lang}">← All posts</a>

      <div class="post-header__meta">
        <time th:datetime="${post.publishedAt}"
              th:text="${#temporals.format(post.publishedAt, 'MMM d, yyyy')}">Jan 1, 2025
        </time>
        <span class="post-header__reading-time"
              th:text="${readingMinutes} + (${lang == 'es'} ? ' min de lectura' : ' min read')">3 min read</span>
      </div>

      <h1 class="post-header__title" th:text="${translation.title}">Post Title</h1>

      <p class="post-header__excerpt"
         th:if="${translation.excerpt != null}"
         th:text="${translation.excerpt}">Excerpt</p>

      <div class="post-header__tags" th:if="${!tags.isEmpty()}">
        <a class="tag"
           th:each="tag : ${tags}"
           th:text="${tag.name}"
           th:href="${prefix} + '/' + ${lang} + '?tag=' + ${tag.name}">tag</a>
      </div>

      <img class="post-header__cover"
           th:if="${not #strings.isEmpty(post.coverUrl)}"
           th:src="${post.coverUrl}"
           th:alt="${translation.title}"/>
    </header>

    <details class="toc" th:if="${!toc.isEmpty()}">
      <summary th:text="${lang == 'es'} ? 'Contenido' : 'Contents'">Contents</summary>
      <ol>
        <li th:each="entry : ${toc}" th:classappend="${entry.level == 3} ? 'toc__sub'">
          <a th:href="'#' + ${entry.id}" th:text="${entry.text}">Heading</a>
        </li>
      </ol>
    </details>

    <!-- th:utext renders the pre-rendered HTML from flexmark -->
    <div class="post-body" th:utext="${renderedBody}">Post content</div>

    <!-- Plain share links: no third-party scripts, so nothing loads until the reader clicks -->
    <footer class="share" th:if="${site.config.showShareButtons}"
            th:with="postUrl=${'https://' + site.domain + prefix + '/' + lang + '/articles/' + translation.slug},
                     encUrl=${#uris.escapeQueryParam(postUrl)},
                     encText=${#uris.escapeQueryParam(translation.title)}">
      <span class="share__label" th:text="${lang == 'es'} ? 'Compartir' : 'Share'">Share</span>
      <a class="share__link share__link--x" target="_blank" rel="noopener noreferrer"
         th:href="'https://x.com/intent/post?url=' + ${encUrl} + '&text=' + ${encText}">X</a>
      <a class="share__link share__link--bluesky" target="_blank" rel="noopener noreferrer"
         th:href="'https://bsky.app/intent/compose?text=' + ${encText} + '%20' + ${encUrl}">Bluesky</a>
      <a class="share__link share__link--linkedin" target="_blank" rel="noopener noreferrer"
         th:href="'https://www.linkedin.com/sharing/share-offsite/?url=' + ${encUrl}">LinkedIn</a>
      <a class="share__link share__link--facebook" target="_blank" rel="noopener noreferrer"
         th:href="'https://www.facebook.com/sharer/sharer.php?u=' + ${encUrl}">Facebook</a>
      <button type="button" class="share__link share__link--copy" th:data-url="${postUrl}"
              th:data-done="${lang == 'es'} ? '¡Copiado!' : 'Copied!'"
              th:text="${lang == 'es'} ? 'Copiar enlace' : 'Copy link'">Copy link
      </button>
      <!-- Shown by script only where the Web Share API exists (mostly mobile) -->
      <button type="button" class="share__link share__link--native" hidden th:data-url="${postUrl}"
              th:data-title="${translation.title}"
              th:text="${lang == 'es'} ? 'Más…' : 'More…'">More…
      </button>
    </footer>
  </article>
</main>

<th:block th:replace="~{fragments/layout :: footer}"/>
<script th:inline="javascript">
  const _hljsLangs = /*[[${codeLanguages}]]*/ [];
  const _postLang = /*[[${lang}]]*/ 'en';
  const _postSlug = /*[[${translation.slug}]]*/ '';
  const _prefix = /*[[${prefix}]]*/ '';
</script>
<script>
  fetch(`${_prefix}/${_postLang}/posts/${_postSlug}/event`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type: 'view'}),
    keepalive: true
  }).catch(() => {
  });

  const copyBtn = document.querySelector('.share__link--copy');
  copyBtn?.addEventListener('click', () => {
    navigator.clipboard.writeText(copyBtn.dataset.url).then(() => {
      const label = copyBtn.textContent;
      copyBtn.textContent = copyBtn.dataset.done;
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = label;
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  });

  const nativeBtn = document.querySelector('.share__link--native');
  if (nativeBtn && navigator.share) {
    nativeBtn.hidden = false;
    nativeBtn.addEventListener('click', () => {
      navigator.share({title: nativeBtn.dataset.title, url: nativeBtn.dataset.url}).catch(() => {
      });
    });
  }
</script>
<script type="module">
  import hljs from 'https://esm.sh/highlight.js@11.11.1/lib/core';

  await Promise.all(_hljsLangs.map(l =>
    import(`https://esm.sh/highlight.js@11.11.1/lib/languages/${l}`)
      .then(m => hljs.registerLanguage(l, m.default))
      .catch(() => {
      })
  ));
  hljs.highlightAll();
  document.querySelectorAll('.post-body pre').forEach(pre => {
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(pre.querySelector('code').innerText).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    });
    wrapper.appendChild(btn);
  });
</script>
</body>
</html>
